name: docker

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/neocass/vs10-build-tools

jobs:
  docker_build:
    # windows-2022 (NOT windows-latest): the host kernel must match the
    # ltsc2022 base image so Docker can use process isolation. Hosted runners
    # have no nested virtualization, so Hyper-V isolation is unavailable and a
    # kernel mismatch (e.g. a windows-2025 host) fails the build.
    runs-on: windows-2022
    # GitHub-hosted jobs are hard-capped at 6h regardless of this value.
    timeout-minutes: 350

    steps:
      # Host OS revision. Must run on the runner, not inside the build: the
      # container has its own registry and would report the image's revision.
      - name: Host OS revision
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          Write-Host "Host: $($cv.CurrentBuildNumber).$($cv.UBR)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # REQUIRED: without this the VS2010 installers arrive as LFS pointer
          # files and Docker COPY would bake 130-byte stubs into the image.
          lfs: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Buildx/BuildKit cannot build Windows containers, so build-push-action
      # is not usable here; the classic builder is the supported path.
      - name: Build
        shell: pwsh
        run: |
          $buildArgs = @()
          "${{ steps.meta.outputs.tags }}".Split("`n") |
            Where-Object { $_ } | ForEach-Object { $buildArgs += @("-t", $_.Trim()) }
          "${{ steps.meta.outputs.labels }}".Split("`n") |
            Where-Object { $_ } | ForEach-Object { $buildArgs += @("--label", $_.Trim()) }
          docker build @buildArgs .

      - name: Push
        shell: pwsh
        run: |
          "${{ steps.meta.outputs.tags }}".Split("`n") |
            Where-Object { $_ } | ForEach-Object { docker push $_.Trim() }

      - name: Clean up local image
        if: always()
        shell: pwsh
        run: |
          "${{ steps.meta.outputs.tags }}".Split("`n") |
            Where-Object { $_ } | ForEach-Object { docker rmi -f $_.Trim() 2>$null }
          exit 0
